<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>สะสมแต้มความน่ารักตอนอกะชอลอวอ</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="สะสมแต้ม">

  <link rel="apple-touch-icon" href="icon.jpg?v=4">
  <link rel="icon" href="icon.jpg?v=4">

  <!-- โหลด Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Chakra Petch", sans-serif;
    }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 24px) 20px;
      min-height: 100vh;
      background-color: #221a22;
      color: #f7eaf0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: bold;
      margin: 12px 0 16px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #322533;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .photo-avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f79ac0;
      box-shadow: 0 4px 16px rgba(247, 154, 192, 0.4);
      margin-bottom: 12px;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .photo-avatar.bounce {
      transform: scale(1.12) rotate(3deg);
    }
    .score-value {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      margin-top: 4px;
      color: #ffffff;
    }
    .score-target {
      font-size: 0.95rem;
      color: #bfaab6;
      margin-top: 6px;
    }
    .status-text {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #dfcbd5;
      text-align: center;
    }
    .btn-main {
      width: 100%;
      max-width: 360px;
      background: #f79ac0;
      color: #3b0923;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 26px;
      padding: 16px 0;
      margin-top: 16px;
      box-shadow: 0 6px 18px rgba(247, 154, 192, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.08s ease, filter 0.08s ease;
    }
    .btn-main:active {
      transform: scale(0.96);
      filter: brightness(0.92);
    }
    .btn-group {
      width: 100%;
      max-width: 360px;
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    .btn-sub {
      flex: 1;
      background: #3a2b3b;
      color: #f7eaf0;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 12px 0;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.08s ease;
    }
    .btn-sub:active {
      transform: scale(0.96);
      background: #4a374c;
    }
    .stats-row {
      width: 100%;
      max-width: 360px;
      display: flex;
      gap: 10px;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    .stat-box {
      flex: 1;
      background: #2e222f;
      border-radius: 18px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .stat-label {
      font-size: 0.75rem;
      color: #bfaab6;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="header-title">
    <span>🌸</span> สะสมแต้มความน่ารักตอนอกะชอลอวอ <span>🌸</span>
  </div>

  <div class="card">
    <img src="avatar.jpg?v=4" alt="Avatar" class="photo-avatar" id="avatarImg">
    <div class="score-value" id="scoreDisplay">0</div>
    <div class="score-target">จาก 10,000 แต้ม</div>
    <div class="status-text" id="statusMessage">กำลังโหลดข้อมูล...</div>
  </div>

  <button class="btn-main" id="btnAdd">
    <span>💖</span> +10 แต้ม
  </button>

  <div class="btn-group">
    <button class="btn-sub" id="btnUndo">↩ ย้อนกลับ</button>
    <button class="btn-sub" id="btnReset">เริ่มใหม่</button>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <span class="stat-label">สะสมแล้ว</span>
      <span class="stat-val" id="countDisplay">0 ครั้ง</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">เหลืออีก</span>
      <span class="stat-val" id="remainDisplay">10,000</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">สำเร็จ</span>
      <span class="stat-val" id="pctDisplay">0.0%</span>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://tornor-chalawee-point-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const scoreRef = db.ref('points_tracker');

    const TARGET = 10000;
    const STEP = 10;

    let currentState = {
      score: 0,
      count: 0,
      history: []
    };

    function render(state) {
      document.getElementById('scoreDisplay').innerText = state.score.toLocaleString();
      document.getElementById('countDisplay').innerText = `${state.count.toLocaleString()} ครั้ง`;
      
      const remain = Math.max(0, TARGET - state.score);
      document.getElementById('remainDisplay').innerText = remain.toLocaleString();

      const pct = ((state.score / TARGET) * 100).toFixed(1);
      document.getElementById('pctDisplay').innerText = `${pct}%`;

      const msg = document.getElementById('statusMessage');
      if (state.score >= TARGET) {
        msg.innerText = "🎉 ยินดีด้วย! สะสมครบเป้าหมายแล้ว!";
      } else if (state.score > 0) {
        msg.innerText = `สะสมไปแล้ว ${state.score.toLocaleString()} แต้ม เธอยังน่ารักเพิ่มได้อีก ><`;
      } else {
        msg.innerText = "แตะปุ่มเพื่อเริ่มสะสมแต้มกัน";
      }
    }

    // ฟังค่าเปลี่ยนแปลงแบบ Realtime
    scoreRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        currentState = {
          score: data.score || 0,
          count: data.count || 0,
          history: data.history || []
        };
      } else {
        currentState = { score: 0, count: 0, history: [] };
      }
      render(currentState);
    });

    // กดเพิ่มแต้ม
    document.getElementById('btnAdd').addEventListener('click', () => {
      const hist = currentState.history || [];
      hist.push({ score: currentState.score, count: currentState.count });
      
      scoreRef.set({
        score: currentState.score + STEP,
        count: currentState.count + 1,
        history: hist
      });

      const img = document.getElementById('avatarImg');
      img.classList.add('bounce');
      setTimeout(() => img.classList.remove('bounce'), 160);
    });

    // กดย้อนกลับ
    document.getElementById('btnUndo').addEventListener('click', () => {
      const hist = currentState.history || [];
      if (hist.length > 0) {
        const last = hist.pop();
        scoreRef.set({
          score: last.score,
          count: last.count,
          history: hist
        });
      }
    });

    // กดเริ่มใหม่
    document.getElementById('btnReset').addEventListener('click', () => {
      if (confirm("ต้องการรีเซ็ตแต้มกลับเป็น 0 ใช่ไหม?")) {
        scoreRef.set({
          score: 0,
          count: 0,
          history: []
        });
      }
    });
  </script>
</body>
</html>
