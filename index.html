<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>สะสมแต้ม</title>

  <!-- ตั้งค่าสำหรับเปิดเต็มจอเหมือนแอป (iOS Standalone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="สะสมแต้ม">

  <!-- ไอคอนหน้าจอโฮมรูปน้องแฮมสเตอร์ (แปลงจาก SVG โดยตรง ไม่ต้องโหลดไฟล์แยก) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180' width='180' height='180'><rect width='180' height='180' rx='40' fill='%23221b24'/><circle cx='46' cy='48' r='20' fill='%23f6c77d'/><circle cx='46' cy='48' r='12' fill='%23f99bb1'/><circle cx='134' cy='48' r='20' fill='%23f6c77d'/><circle cx='134' cy='48' r='12' fill='%23f99bb1'/><ellipse cx='90' cy='98' rx='62' ry='54' fill='%23fae0aa'/><ellipse cx='90' cy='112' rx='34' ry='24' fill='%23ffffff'/><circle cx='68' cy='88' r='7' fill='%23221b24'/><circle cx='112' cy='88' r='7' fill='%23221b24'/><ellipse cx='52' cy='102' rx='12' ry='7' fill='%23f99bb1'/><ellipse cx='128' cy='102' rx='12' ry='7' fill='%23f99bb1'/><path d='M85 102 L95 102 L90 108 Z' fill='%23f99bb1'/><path d='M90 108 L90 114' stroke='%23221b24' stroke-width='2'/><rect x='86' y='114' width='8' height='8' rx='2' fill='%23ffffff' stroke='%23221b24' stroke-width='1.5'/></svg>">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Chakra Petch", sans-serif;
    }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 24px) 20px;
      min-height: 100vh;
      background-color: #221a22;
      color: #f7eaf0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin: 12px 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #322533;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .hamster-avatar {
      width: 120px;
      height: 120px;
      margin-bottom: 8px;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .hamster-avatar.bounce {
      transform: scale(1.15) rotate(3deg);
    }
    .score-value {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      margin-top: 4px;
      color: #ffffff;
    }
    .score-target {
      font-size: 0.95rem;
      color: #bfaab6;
      margin-top: 6px;
    }
    .status-text {
      margin-top: 22px;
      font-size: 0.95rem;
      color: #dfcbd5;
    }
    .btn-main {
      width: 100%;
      max-width: 360px;
      background: #f79ac0;
      color: #3b0923;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 26px;
      padding: 16px 0;
      margin-top: 16px;
      box-shadow: 0 6px 18px rgba(247, 154, 192, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.08s ease, filter 0.08s ease;
    }
    .btn-main:active {
      transform: scale(0.96);
      filter: brightness(0.92);
    }
    .btn-group {
      width: 100%;
      max-width: 360px;
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    .btn-sub {
      flex: 1;
      background: #3a2b3b;
      color: #f7eaf0;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 12px 0;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.08s ease;
    }
    .btn-sub:active {
      transform: scale(0.96);
      background: #4a374c;
    }
    .stats-row {
      width: 100%;
      max-width: 360px;
      display: flex;
      gap: 10px;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    .stat-box {
      flex: 1;
      background: #2e222f;
      border-radius: 18px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .stat-label {
      font-size: 0.75rem;
      color: #bfaab6;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="header-title">
    <span>🌸</span> สะสมแต้มกับน้องแฮมสเตอร์ <span>🌸</span>
  </div>

  <div class="card">
    <!-- ภาพเวกเตอร์น้องแฮมสเตอร์ -->
    <svg class="hamster-avatar" id="avatar" viewBox="0 0 160 160">
      <circle cx="36" cy="38" r="18" fill="#f6c77d"/>
      <circle cx="36" cy="38" r="10" fill="#f99bb1"/>
      <circle cx="124" cy="38" r="18" fill="#f6c77d"/>
      <circle cx="124" cy="38" r="10" fill="#f99bb1"/>
      <ellipse cx="80" cy="85" rx="56" ry="50" fill="#fae0aa"/>
      <ellipse cx="80" cy="98" rx="30" ry="22" fill="#ffffff"/>
      <circle cx="60" cy="78" r="6" fill="#221b24"/>
      <circle cx="100" cy="78" r="6" fill="#221b24"/>
      <ellipse cx="46" cy="89" rx="10" ry="6" fill="#f99bb1"/>
      <ellipse cx="114" cy="89" rx="10" ry="6" fill="#f99bb1"/>
      <path d="M76 89 L84 89 L80 94 Z" fill="#f99bb1"/>
      <path d="M80 94 L80 99" stroke="#221b24" stroke-width="1.6"/>
      <rect x="76.5" y="99" width="7" height="7" rx="1.5" fill="#ffffff" stroke="#221b24" stroke-width="1.2"/>
    </svg>

    <div class="score-value" id="scoreDisplay">0</div>
    <div class="score-target">จาก 10,000 แต้ม</div>
    <div class="status-text" id="statusMessage">แตะปุ่มเพื่อเริ่มสะสมแต้มกัน</div>
  </div>

  <button class="btn-main" id="btnAdd">
    <span>💖</span> +10 แต้ม
  </button>

  <div class="btn-group">
    <button class="btn-sub" id="btnUndo">↩ ย้อนกลับ</button>
    <button class="btn-sub" id="btnReset">เริ่มใหม่</button>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <span class="stat-label">สะสมแล้ว</span>
      <span class="stat-val" id="countDisplay">0 ครั้ง</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">เหลืออีก</span>
      <span class="stat-val" id="remainDisplay">10,000</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">สำเร็จ</span>
      <span class="stat-val" id="pctDisplay">0.0%</span>
    </div>
  </div>

  <script>
    const TARGET = 10000;
    const STEP = 10;
    const STORAGE_KEY = "hamster_points_tracker";

    let state = {
      score: 0,
      count: 0,
      history: []
    };

    // โหลดข้อมูลเก่าที่เคยบันทึกไว้
    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          console.error("Failed to parse saved state", e);
        }
      }
      render();
    }

    // เซฟข้อมูลลงในความจำเครื่อง
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function render() {
      document.getElementById('scoreDisplay').innerText = state.score.toLocaleString();
      document.getElementById('countDisplay').innerText = `${state.count.toLocaleString()} ครั้ง`;
      
      const remain = Math.max(0, TARGET - state.score);
      document.getElementById('remainDisplay').innerText = remain.toLocaleString();

      const pct = ((state.score / TARGET) * 100).toFixed(1);
      document.getElementById('pctDisplay').innerText = `${pct}%`;

      const msg = document.getElementById('statusMessage');
      if (state.score >= TARGET) {
        msg.innerText = "🎉 ยินดีด้วย! สะสมครบเป้าหมายแล้ว!";
      } else if (state.score > 0) {
        msg.innerText = `สะสมไปแล้ว ${state.score.toLocaleString()} แต้ม สู้ๆ นะ!`;
      } else {
        msg.innerText = "แตะปุ่มเพื่อเริ่มสะสมแต้มกัน";
      }
    }

    // ฟังก์ชันกดเพิ่มแต้ม
    document.getElementById('btnAdd').addEventListener('click', () => {
      state.history.push({ score: state.score, count: state.count });
      state.score += STEP;
      state.count += 1;
      saveData();
      render();

      // แอนิเมชันเด้งของน้องแฮมสเตอร์
      const avatar = document.getElementById('avatar');
      avatar.classList.add('bounce');
      setTimeout(() => avatar.classList.remove('bounce'), 160);
    });

    // ฟังก์ชันย้อนกลับ
    document.getElementById('btnUndo').addEventListener('click', () => {
      if (state.history.length > 0) {
        const last = state.history.pop();
        state.score = last.score;
        state.count = last.count;
        saveData();
        render();
      }
    });

    // ฟังก์ชันเริ่มใหม่
    document.getElementById('btnReset').addEventListener('click', () => {
      if (confirm("ต้องการรีเซ็ตแต้มกลับเป็น 0 ใช่ไหม?")) {
        state = { score: 0, count: 0, history: [] };
        saveData();
        render();
      }
    });

    loadData();
  </script>
</body>
</html>
